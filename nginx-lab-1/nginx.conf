
worker_processes  1;

error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  proxy '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent '
                      'upstream: $upstream_addr '
                      'response_time: $upstream_response_time '
                      'connect_time: $upstream_connect_time';

    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    proxy_cache_path temp/cache levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m;

    upstream backends_rr {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
    }

    upstream backends_lc {
        least_conn;
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
    }

    # ============================================
    # SITE 1: Static HTML on port 80
    # ============================================
    server {
        listen       80;
        server_name  localhost;

        location / {
            root   sites/site1;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   sites/site1;
        }
    }

    # ============================================
    # SITE 2: Location routing on port 8080
    # ============================================
    server {
        listen       8080;
        server_name  localhost;

        access_log  logs/site2_access.log  main;

        location = /about {
            root   sites/site2;
            rewrite ^ /about.html break;
        }

        location /contact {
            root   sites/site2;
            rewrite ^ /contact.html break;
        }

        location ~* \.(jpg|png|gif|ico|css|js)$ {
            root   sites/site2;
            add_header Cache-Control "public, max-age=3600";
        }

        location / {
            root   sites/site2;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   sites/site2;
        }
    }

    # ============================================
    # REVERSE PROXY: port 9000
    # ============================================
    server {
        listen       9000;
        server_name  localhost;

        access_log  logs/proxy_access.log  proxy;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================
    # LOAD BALANCE: round-robin on port 9001
    # ============================================
    server {
        listen       9001;
        server_name  localhost;

        access_log  logs/lb_rr_access.log  proxy;

        location / {
            proxy_pass http://backends_rr;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================
    # LOAD BALANCE: least_conn on port 9002
    # ============================================
    server {
        listen       9002;
        server_name  localhost;

        access_log  logs/lb_lc_access.log  proxy;

        location / {
            proxy_pass http://backends_lc;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================
    # CACHING PROXY: port 9003
    # ============================================
    server {
        listen       9003;
        server_name  localhost;

        access_log  logs/cache_access.log  proxy;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache my_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }

    # ============================================
    # HTTP -> HTTPS REDIRECT (uncomment to enable)
    # ============================================
    # server {
    #     listen       80;
    #     server_name  localhost;
    #     return 301 https://$host$request_uri;
    # }

    # ============================================
    # HTTPS: port 443
    # ============================================
    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate      ../certs/localhost.crt;
        ssl_certificate_key  ../certs/localhost.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            root   sites/site1;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   sites/site1;
        }
    }
}
